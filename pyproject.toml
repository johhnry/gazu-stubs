[project]
name = "gazu-stubs"
version = "0.1.2"
description = "Stub-only package for CGWire's Gazu Python library"
readme = "README.md"
requires-python = ">=3.9"

[dependency-groups]
dev = [
  "python-socketio[client]>=5.8.0,<6",
  "black>=24.4.2,<25",
  "basedpyright>=1.31.0,<2",
  "ruff>=0.5.4,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gazu-stubs"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.basedpyright]
reportUnusedImport = false
